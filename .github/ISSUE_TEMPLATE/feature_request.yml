name: Feature request
description: Suggest a musician workflow or DnBOX improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing requests first and link duplicates. An issue or community reaction is not acceptance, owner approval or a delivery promise.
        Feature voting is still under design; do not infer permission for settings, publication or device writes from a vote.
        Keep private files and credentials out of this public issue.
  - type: dropdown
    id: scope
    attributes:
      label: Affected area
      options:
        - Firmware / device workflow
        - Website / Remote / editor
        - Installer / samples / projects
        - Sound / performance
        - Documentation / repository
        - Other / not sure
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Device or browser context
      description: Relevant model, version, source branch/SHA or website URL, if known.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the musical task and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Proposed improvement
      description: Explain the change, behavior to preserve and any constraints.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How would we know it works?
      description: A concrete example or acceptance check. Do not require an unapproved device operation.
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: Existing requests and references
      description: Link related issues, approved designs or safe public examples.

