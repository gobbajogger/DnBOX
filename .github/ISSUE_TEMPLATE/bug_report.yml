name: Bug report
description: Report a DnBOX firmware or source problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Share only information safe for this public repository. Do not upload credentials, private backups, raw captures or proprietary files.
        Describe the problem without flashing hardware merely to reproduce it.
        For a vulnerability, use the [security policy](https://github.com/gobbajogger/X0X37-for-Loopy-Pro/security/policy) instead of this public form.
  - type: dropdown
    id: model
    attributes:
      label: Device model
      options:
        - SMK-37 Elite
        - SMK-37 Pro
        - FM-1
        - Browser only / other / not sure
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Version and source
      description: Device version, repository/branch and commit SHA if known; for a website include its exact URL.
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host and connection
      description: Browser/OS, application version and USB/Bluetooth/offline, where relevant. No account or device secrets.
  - type: dropdown
    id: backup_done
    attributes:
      label: Backup status before the incident
      options:
        - "Backed up"
        - "Not backed up"
        - "Not applicable"
        - "Unknown"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the starting state and the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence and previous behavior
      description: Optional sanitized test output, public screenshots, exact source evidence or last known working version. Say what was not tested.

